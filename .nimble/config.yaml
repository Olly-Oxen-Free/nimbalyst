# NIMBLE Configuration
# Generated by /nimble:configure (Basic Mode, Fast Track)

config_version: "2.0"
mode: fast-track

project:
  name: "nimbalyst"
  runtime: "node>=24"
  package_manager: "npm"

commands:
  build: "npm run build"
  test: "npm run test:prepush"
  lint: "none"
  typecheck: "npm run typecheck"

boundaries:
  never_touch:
    - "node_modules/**"
    - "dist/**"
    - "out/**"
    - "out2/**"
    - "release/**"
    - ".vite/**"

  require_review:
    - "package.json"
    - "package-lock.json"
    - "packages/electron/src/main/**"
    - "packages/runtime/src/auth/jwtScopes.ts"
    - "packages/electron/build/**"
    - "CHANGELOG.md"

execution:
  default_model: "sonnet"
  max_parallel_tasks: 3
  pre_pr_checks:
    - "build"
    - "typecheck"

review:
  enabled: false
  provider: null                     # greptile | code-review | none
  threshold: 5
  max_revision_loops: 3
  none_behavior: manual
  allow_below_threshold_on:
    - future-work-overlap
    - false-positive-factual
  final_merge_gate:
    enabled: true
    verify_deferred_findings: true
  pre_execution_prompt: true

cost_controls:
  enable_escalation: true
  max_attempts: 3
  retry_delay_seconds: 10

# Beads capability tier — nimbalyst-beads MCP tools detected in this session
work_tracking:
  beads:
    tier: mcp
    detected_at: "2026-08-20T00:00:00Z"

# Claude subscription
subscription:
  plan: max-5x
  team_seats: 1
  enterprise_capacity: 0
  configured_at: "2026-08-20T00:00:00Z"
