metadata:
  prd_slug: "native-tile-system"
  created_at: "2026-08-29T00:00:00Z"
  total_complexity: 46
  task_count: 11

tasks:
  - id: "1a"
    title: "Evaluate and pin react-mosaic-component version; add as a dependency"
    description: |
      Research recommends adopting `react-mosaic-component` as the split-pane/tiling engine
      (see research/summary.md, OQ2 in the PRD). At research time it was mid-migration: v6 is the
      last stable release with a binary-tree layout model; v7 was in beta with an n-ary tree model.

      Before adding the dependency: re-check the current published version and changelog. Pick v6
      (binary, stable) unless v7 has since reached a stable release AND its n-ary model is
      confirmed compatible with this PRD's binary-split-plus-stacking requirement (n-ary is a
      superset of binary, so it should be compatible, but verify the API surface -- particularly
      `MosaicWindow`/tab-group support -- before committing).

      Add the chosen version to `packages/electron/package.json` (this is a `require_review` path
      per `.nimble/config.yaml` -- package.json changes need review). Verify it installs cleanly
      and its peer-dependency React version range covers this repo's React version (this repo is
      on React 19 -- confirm `packages/electron/package.json`'s exact pinned version). Check
      react-mosaic's transitive dependencies (commonly `react-dnd`/`react-dnd-html5-backend` for
      libraries in this space -- verify, do not assume) for React 19 compatibility specifically --
      this is the single most likely cause of this task failing outright, more likely than the
      mosaic package's own peer range.

      Two claims from research were NOT verified against a live source (research explicitly notes
      "no live web search performed") and are load-bearing for later tasks -- verify both before
      finishing this task, not by accident later:
      1. **Tab-group-as-first-class-node claim.** Research's build-vs-adopt recommendation rests on
         react-mosaic modeling "tab groups as a first-class node type." Confirm this against the
         library's actual current docs/API (e.g. `MosaicWindow`'s tab-group support, or whatever
         the current API calls it). Note: this PRD's design does NOT strictly depend on the library
         providing native tab groups -- `TileTabStrip` (task 3a) already provides stacking
         independently of react-mosaic's own tab-group feature, hosted inside a single mosaic leaf.
         If the claim turns out to be false, the library recommendation likely still holds (the
         split/resize engine is still the valuable, hard-to-hand-build part) -- but confirm this
         deliberately and record the corrected rationale in this task's commit message rather than
         discovering it accidentally during task 5a/6a.
      2. **Drag-and-drop system compatibility.** Confirm what DnD mechanism react-mosaic uses
         internally for its own split/drop zones (commonly `react-dnd` for libraries in this
         space -- verify, do not assume). `TileTabStrip`'s tab dragging (task 3a) reuses `TabBar`'s
         existing native HTML5 `dataTransfer`-based drag, per research. Confirm whether a native
         HTML5 drag can act as a drop source into react-mosaic's split zones, or whether task 5a
         will need a bridging/adapter layer (or a different DnD approach for the tab-to-edge
         gesture specifically). This materially affects task 5a's approach -- resolve at this
         (cheap, wave-1) task rather than discovering incompatibility four opus-complexity tasks in.

      Tests: none required for a dependency addition alone (no runtime behavior yet). If the
      package ships its own type definitions, verify `npm run typecheck` passes with a trivial
      smoke import.
    depends_on: []
    complexity: 2
    priority: "must"
    success_criteria:
      - "react-mosaic-component is added to packages/electron/package.json at a deliberately chosen, documented version"
      - "npm install succeeds and npm run typecheck is unaffected"
    files_affected:
      - "packages/electron/package.json"
      - "package-lock.json"

  - id: "2a"
    title: "Extend the Tab model to support teammate/task tile kinds"
    description: |
      `packages/electron/src/renderer/components/TabManager/TabBar.tsx` and `TabManager.tsx`
      already define a `Tab` interface with a `kind?: 'file' | 'tracker'` discriminator. Extend
      this union to add `'teammate' | 'task'` kinds (confirm exact current union values by reading
      the type first -- do not assume the two listed here are exhaustive).

      Add a mapping layer (new small module, or a function colocated with the existing
      teammate/task tile atoms in `packages/electron/src/renderer/store/atoms/agentMode.ts`) that
      projects the existing open-tile state (`openTeammateTilesAtomFamily`,
      `openTaskInlineExpandAtomFamily`-equivalent atoms -- confirm exact atom names by reading the
      file) into `Tab`-shaped descriptors: `id`, `title` (agent/task name), `kind`
      ('teammate'/'task'), `isProcessing`/`hasUnread` (map from existing teammate/task working and
      unread-message state -- confirm field names in the source atoms).

      This task does NOT change `openTeammateTilesAtomFamily`'s own shape (per PRD decision D4) --
      it only adds a read-side projection to `Tab` shape for consumption by task 3a's tab strip.

      Tests: red-first. Add a test for the new projection function/atom: given a fixture open-tile
      state (teammate working, teammate idle-with-unread, task in progress), assert the resulting
      `Tab[]` has the correct `kind`, `isProcessing`, `hasUnread` values. Unit-test the pure
      projection function directly if it is a standalone function; if it must be a derived Jotai
      atom, test via the store per this repo's Jotai testing pattern (see JOTAI.md).
    depends_on: []
    complexity: 3
    priority: "must"
    success_criteria:
      - "Tab.kind supports 'teammate' and 'task' in addition to existing kinds"
      - "A projection from existing teammate/task tile-open atoms to Tab[] exists and is covered by a test"
      - "openTeammateTilesAtomFamily and sibling atoms' own shape is unchanged"
    files_affected:
      - "packages/electron/src/renderer/components/TabManager/TabBar.tsx"
      - "packages/electron/src/renderer/components/TabManager/TabManager.tsx"
      - "packages/electron/src/renderer/store/atoms/agentMode.ts"
      - "packages/electron/src/renderer/store/atoms/__tests__/agentMode.test.ts (extend if it exists, else new sibling)"

  - id: "3a"
    title: "Build a tile-scoped tab strip (TileTabStrip) wrapping the existing TabBar"
    description: |
      Per PRD decision D1 (also Open Question OQ1 -- flagged for user confirmation, not fully
      settled): tiles get their OWN tab strip, visually/behaviorally identical to the top one,
      scoped to the tiled region -- not merged into the document tab strip's namespace.

      Build a `TileTabStrip` component that instantiates the existing `TabBar` (confirmed reusable
      by research: it takes `tabs`/`activeTabId` as props, not hard-wired to the global
      `TabsContext`) fed a filtered `Tab[]` list from task 2a's projection, scoped to one tiled
      region (one pane in the eventual mosaic tree). Do not fork or duplicate `TabBar` --
      parameterize the existing component.

      At this stage there is only one tiled region (task 4a introduces the mosaic tree) -- this
      task's job is the tab-strip component in isolation, testable independently of the layout
      engine.

      Per OQ4, assume a single unified region hosts both teammate and task tabs together unless
      investigation of the existing rail components reveals a strong reason to keep them separate
      -- if so, note the finding in this task's commit message and flag it as a correction to OQ4
      for the human reviewer.

      Tests: red-first. Render `TileTabStrip` with a fixture `Tab[]` mixing teammate and task
      kinds; assert open/active/close/reorder behavior matches `TabBar`'s existing tested behavior
      (reuse `TabBar`'s own test suite as a reference for what "identical behavior" means). Do not
      assert on CSS classNames for drag state.
    depends_on: ["2a"]
    complexity: 4
    priority: "must"
    success_criteria:
      - "TileTabStrip renders teammate and task tabs using the existing TabBar component, unforked"
      - "Tab open/close/reorder/active-state behavior matches the top tab strip"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TileTabStrip.tsx (new)"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TileTabStrip.test.tsx (new)"
      - "packages/electron/src/renderer/components/TabManager/TabBar.tsx"

  - id: "4a"
    title: "Core split-pane integration: single-node react-mosaic tree hosting TileTabStrip"
    description: |
      Replace `TeammateTileRail.tsx`/`TaskTileRail.tsx`'s fixed horizontal-scroll rail layout with
      a `react-mosaic-component` `Mosaic` tree. At this stage the tree has exactly ONE leaf node
      (no splitting/stacking yet -- those are tasks 5a/6a) so day-one behavior is functionally
      equivalent to the current rail: all open teammate/task tiles appear as tabs in one
      `TileTabStrip` (task 3a) inside that single mosaic leaf, with the active tab's content pane
      showing the focused tile's transcript view (reuse existing transcript-rendering, do not
      rebuild it).

      This is the foundational risk task -- get the single-node case fully correct (mount/unmount
      behavior, styling against `--nim-*` variables, sizing within `SessionTranscript.tsx`'s
      layout) before task 5a/6a add real splitting logic on top.

      A gate follows this task (see execution_plan.yaml) -- the human should confirm the
      react-mosaic version choice (1a) and the tab-strip-scoping decision (OQ1) are working as
      expected before 5a/6a/7a build further on this foundation. Note for the gate reviewer: at
      this point simultaneous multi-tile visibility (today's side-by-side rail) is intentionally
      NOT yet restored -- only the active tab's tile is visible, since splitting isn't implemented
      until 5a. This is an expected interim state, not a regression.

      Tests: red-first. Test that a single open teammate tile and a single open task tile both
      render inside the new mosaic-hosted TileTabStrip; test that closing all tiles collapses back
      to the "no tiles open" state (whatever that currently renders as in `SessionTranscript.tsx`).
      Do not yet test split/stack behavior (not implemented until 5a/6a).
    depends_on: ["1a", "3a"]
    complexity: 6
    priority: "must"
    success_criteria:
      - "TeammateTileRail/TaskTileRail's fixed-rail layout is replaced by a single-node react-mosaic tree hosting TileTabStrip"
      - "Tile open/close/focus state and transcript rendering are preserved; simultaneous multi-tile visibility (today's side-by-side rail) is intentionally NOT preserved at this stage -- only the active tab's tile is visible until 5a's splits land. This is an expected, temporary interim state, not a regression to fix here."
      - "No split or stack capability yet -- that is explicitly out of scope for this task"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TeammateTileRail.tsx"
      - "packages/electron/src/renderer/components/AgentMode/TaskTileRail.tsx"
      - "packages/electron/src/renderer/components/AgentMode/TiledRegion.tsx (new -- mosaic host component)"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TiledRegion.test.tsx (new)"

  - id: "5a"
    title: "Drag-to-edge splitting: dragging a tile's tab to a pane edge creates a horizontal or vertical split"
    description: |
      Wire `TileTabStrip`'s existing native-HTML5-DnD tab-drag (confirmed by research: TabBar's
      reordering already uses native `dataTransfer`, not `@dnd-kit`) to react-mosaic's split API.
      When a tab is dragged and dropped near the edge of a pane (rather than reordering within the
      same strip), create a new mosaic split node at that edge: dropping on the left/right edge
      creates a vertical split (side-by-side columns); dropping on the top/bottom edge creates a
      horizontal split (stacked rows) -- matching niri's edge-drop convention described in the PRD.

      Determine edge-vs-reorder-vs-center (task 6a) intent by drop-zone geometry within the target
      pane (e.g. edge zones as a percentage of the pane's bounding box, center zone for 6a).
      React-mosaic's own drag-and-drop primitives (`MosaicDragType`, `MosaicWindow`'s built-in
      drop-target support) may already provide this distinction -- prefer using them over
      hand-rolling geometry detection if they cover this case; investigate react-mosaic's own
      DnD API before building a custom one.

      Tests: red-first. Simulate a drop event at each edge (top/bottom/left/right) of an existing
      pane and assert the resulting mosaic tree shape (a new split node of the correct orientation
      containing both the original and moved tile). Assert on the resulting tree/state, not on
      pixel positions or CSS classes.
    depends_on: ["4a"]
    complexity: 7
    priority: "must"
    success_criteria:
      - "Dragging a tile's tab to a pane's left/right edge creates a vertical (side-by-side) split"
      - "Dragging a tile's tab to a pane's top/bottom edge creates a horizontal (stacked) split"
      - "The moved tile's tab is removed from its origin pane's TileTabStrip and appears in the new pane"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TiledRegion.tsx"
      - "packages/electron/src/renderer/components/AgentMode/TileTabStrip.tsx"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TiledRegion.test.tsx"

  - id: "6a"
    title: "Tab-stacking: dragging a tile's tab to a pane's center adds it to that pane's tab stack"
    description: |
      Complete the drop-intent handling started in 5a: a drop in the CENTER zone of a target pane
      (not an edge) adds the dragged tile's tab to that pane's existing `TileTabStrip` (stacking --
      both tiles are now reachable as tabs within the same pane) instead of creating a new split.

      Sequenced after 5a (not a hard functional dependency, but both tasks touch the same
      `TiledRegion.tsx` drop-handling logic -- sequenced for file-conflict safety in the shared,
      worktree-free checkout per D7).

      Tests: red-first. Simulate a center-zone drop and assert the target pane's `TileTabStrip` now
      contains both tabs, with no new mosaic split node created, and the dragged tile becomes the
      active tab in its new pane.
    depends_on: ["5a"]
    complexity: 5
    priority: "must"
    success_criteria:
      - "Dragging a tile's tab to a pane's center zone adds it to that pane's tab stack, not a new split"
      - "The stacked tile becomes the active tab in its destination pane"
      - "Edge-drop splitting (5a) is unaffected by this change"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TiledRegion.tsx"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TiledRegion.test.tsx"

  - id: "7a"
    title: "Replace each tile's bespoke compose box with the shared AIInput/SessionAIInput"
    description: |
      `TeammateTileRail.tsx`/`TaskTileRail.tsx` each carry their own duplicated compose input,
      explicitly flagged in existing code comments as "deliberately duplicated" against
      `TeammateThreadPopover.tsx` and requiring lockstep maintenance. Remove both bespoke compose
      boxes and instantiate the existing `AIInput`/`SessionAIInput`
      (`packages/electron/src/renderer/components/UnifiedAI/`) instead, parameterized by whichever
      tile/tab is currently focused within `TiledRegion` (per D3: one shared instance per visible
      focused pane, not one per open tile -- backgrounded/stacked tiles do not get a live compose
      instance).

      `teammateComposeMode()`'s existing revive/inactive branching
      (`TeammateTileRail.tsx:75-86`-equivalent -- confirm current line numbers, they may have
      shifted since research) has no equivalent in `AIInput` and must be preserved as a thin
      wrapper: render the revive/inactive affordance instead of `AIInput` when
      `teammateComposeMode()` says so; render the shared `AIInput` otherwise.

      Do NOT modify `TeammateThreadPopover.tsx`'s own compose box in this task -- confirm whether
      it can now also switch to the shared component in a follow-up, but this PRD's scope is
      tile-compose only; note the opportunity in the commit message rather than acting on it here.

      Tests: red-first. Extend `TeammateTileRail.test.tsx`/`TaskTileRail.test.tsx` (or their
      `TiledRegion`-integrated successors from 4a) to assert: a focused, active/compose-eligible
      tile renders the shared `AIInput` parameterized with the correct `sessionId`; a
      revive/inactive-eligible teammate tile still renders the existing revive/inactive affordance,
      not `AIInput`. Mock the narrowest module (`AIInput` itself or its deep dependencies), not the
      `@nimbalyst/runtime` barrel.
    depends_on: ["4a"]
    complexity: 6
    priority: "must"
    success_criteria:
      - "No bespoke duplicated compose box remains in TeammateTileRail.tsx or TaskTileRail.tsx"
      - "A focused tile's compose UI is the shared AIInput/SessionAIInput, parameterized by that tile's sessionId"
      - "teammateComposeMode's revive/inactive branching is preserved as a wrapper around, not inside, the shared input"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TeammateTileRail.tsx"
      - "packages/electron/src/renderer/components/AgentMode/TaskTileRail.tsx"
      - "packages/electron/src/renderer/components/UnifiedAI/AIInput.tsx (read/instantiate only -- do not modify unless a genuine prop gap is found; if so, note the gap in the commit message)"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TeammateTileRail.test.tsx"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TaskTileRail.test.tsx"

  - id: "8a"
    title: "Remount safety: hide, don't unmount, a backgrounded tab within a tile stack"
    description: |
      Per the editor-state rule's spirit and research's remount-constraint finding: when a pane's
      `TileTabStrip` has multiple stacked tabs (post-6a) and the user switches the active tab
      within that stack, the previously-active tile's content must be hidden (CSS `display:none`
      or equivalent), not unmounted -- avoiding a refetch-on-remount cost against
      `aiGetTeammateTranscript`. `RichTranscriptView` already keeps a per-session VList cache that
      survives remounts (more forgiving than Monaco/Lexical/RevoGrid), but hide-not-unmount is
      still the correct, cheaper behavior and must be verified explicitly, not assumed from the
      cache's existence.

      Audit `TiledRegion`'s pane-content rendering (from 4a/6a) for whether switching the active
      tab within a stack currently remounts the inactive tile's content tree; if so, change it to a
      CSS-hide pattern (render all stacked tiles' content, toggle visibility, rather than
      conditionally rendering only the active one).

      Tests: red-first. Render a pane with two stacked tabs; switch the active tab; assert the
      previously-active tile's content component is still mounted (e.g. via a mount-count spy or
      an effect that would re-fire `aiGetTeammateTranscript` on remount) rather than unmounted and
      remounted.
    depends_on: ["6a", "7a"]
    complexity: 3
    priority: "should"
    success_criteria:
      - "Switching the active tab within a stacked pane hides, rather than unmounts, the previously-active tile's content"
      - "No duplicate aiGetTeammateTranscript fetch occurs when returning to a previously-viewed tile's tab"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TiledRegion.tsx"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TiledRegion.test.tsx"

  - id: "9a"
    title: "Resizable split dividers, styled to app theme; session-lifetime layout state"
    description: |
      Verify/theme react-mosaic's default resizable-divider behavior to use this repo's canonical
      `--nim-*` CSS variables (per UI_PATTERNS.md) rather than the library's default styling.

      Per PRD decision D6 (also Open Question OQ3 -- deferred, not silently dropped): the mosaic
      layout tree (split/stack arrangement) persists only for the session's lifetime, held in a
      Jotai atom colocated with the other tile-open atoms in `agentMode.ts`. Do NOT persist it to
      `workspace-settings`/IPC/disk in this task -- that is explicitly deferred as a should-have
      (R8) pending user confirmation of OQ3. Do NOT use `localStorage` under any circumstances (repo
      rule).

      Tests: red-first. Assert dragging a divider updates the mosaic tree's split percentage in the
      session-lifetime atom; assert the atom's value does not survive a simulated app
      reload/remount (confirming it is genuinely session-lifetime-only, not accidentally persisted).
    depends_on: ["5a"]
    complexity: 4
    priority: "must"
    success_criteria:
      - "Split dividers are draggable/resizable and styled with --nim-* variables, not library-default styling"
      - "Layout state (split tree, sizes) lives in a session-lifetime Jotai atom, not localStorage or workspace-settings"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TiledRegion.tsx"
      - "packages/electron/src/renderer/store/atoms/agentMode.ts"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TiledRegion.test.tsx"

  - id: "10a"
    title: "Final integration: migrate SessionTranscript.tsx to the new tiled region, remove the old rail path"
    description: |
      `SessionTranscript.tsx` currently composes `TeammateTileRail`/`TaskTileRail` alongside the
      main thread pane using the old fixed-rail layout. Migrate this composition to render the new
      `TiledRegion` (from 4a, extended through 5a/6a/7a/8a/9a) instead. Remove the old fixed-rail
      rendering path entirely -- do not leave both paths co-existing behind a flag (no evidence
      this needs to be gradual/flagged; this repo's convention per prior PRDs is a clean cutover).

      Verify no other consumer references the old rail components' now-removed rendering path
      (grep for `TeammateTileRail`/`TaskTileRail` imports across the renderer) before deleting
      dead code.

      Dependency note: this task's hard dependencies are 6a, 7a, and 9a (all must-have). It is
      sequenced in the wave plan after 8a (should-have) as well, but does not functionally require
      it -- if 8a is descoped at review, this task proceeds unaffected.

      Tests: red-first, and this is the integration-level test point -- extend or add a
      `SessionTranscript` test asserting the tiled region renders in place of the old rail, with
      the same open-tile fixture data producing tabs (not a rail of floating panels). Run the full
      existing `TeammateTileRail.test.tsx`/`TaskTileRail.test.tsx` suites (now presumably
      integrated into `TiledRegion.test.tsx` across 4a-9a) to confirm no regression from the
      migration itself.
    depends_on: ["6a", "7a", "9a"]
    complexity: 5
    priority: "must"
    success_criteria:
      - "SessionTranscript.tsx renders TiledRegion in place of the old TeammateTileRail/TaskTileRail fixed layout"
      - "No dead references to the removed fixed-rail rendering path remain"
      - "Full existing tile-related test suite passes against the new integration"
    files_affected:
      - "packages/electron/src/renderer/components/UnifiedAI/SessionTranscript.tsx"
      - "packages/electron/src/renderer/components/AgentMode/TeammateTileRail.tsx"
      - "packages/electron/src/renderer/components/AgentMode/TaskTileRail.tsx"

