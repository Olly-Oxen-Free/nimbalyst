      - "While the teammate runs, new turns appear without reopening the popover (signal-atom-driven refetch, debounced; no polling loop)"
      - "Transcript renders for completed and errored teammates; compose is replaced by the inactive notice for those, and Send still works for running/blocked/idle"
      - "A teammate with zero logged chunks shows the explicit empty state"
      - "Send path regression-free: message a running teammate from the rebuilt popover and the existing sent/failed status line still behaves"
    files_affected:
