    agent_context: |
      Mount site + props: SessionTranscript.tsx:2698-2708 (chip row +
      popover), handleTeammateChipClick :2274-2278; current popover props at
      TeammateThreadPopover.tsx:16-24 (sessionId here is the LEAD session id
      -- keep it; agentId identifies the teammate). SessionTranscriptPeek's
      PEEK_SETTINGS (:24-30), module-level cache (:22) and
