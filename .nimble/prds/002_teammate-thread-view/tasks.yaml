  - id: "3a"
    title: "Stop a running teammate from the popover"
    description: |
      User-facing stop for a running/blocked teammate. The core machinery
      ALREADY EXISTS: TeammateManager.stop(name) (:1915-1942) aborts, removes
      from the map, clears pending messages, and emits status (running branch
      emits 'errored' at :1923; idle branch emits 'completed' at :1936 -- the
      Stop button targets running/blocked only, so the running branch is the
      one that matters; thread sessionId into both);
      ClaudeCodeProvider.stopManagedTeammate(name) (:2578-2580) exposes it.
      This task is plumbing + hardening, not new abort machinery:

      - Extend stop() with an agentId-exact overload (current lookup uses
        fuzzy agentIdMatchesRecipient matching by name) that also takes the
        lead sessionId EXPLICITLY -- today stop()'s status emit depends on
        this.lastUsedSessionId (:1922-1923, :1935-1936), which is unset after
        a restart, so a user stop would silently skip the status update.
        Distinguish the user-stop reason from the stall-watchdog abort in the
        logged outcome.
      - safeHandle 'ai:stopTeammate(sessionId, agentId, workspacePath)' in
        AIService.ts next to ai:sendMessageToTeammate (:3204), plumbed via a
        ClaudeCodeProvider method following sendMessageToManagedTeammate's
        pattern. Preload + electron.d.ts.
      - Renderer: Stop button in the rebuilt popover's header, visible only
        for running/blocked statuses, with an in-flight disabled state.

      PRD Q3 is resolved before this task starts: REUSE 'errored' with a
      user-stop-distinguishing message; no new status value, so
      subAgentStatus.ts and SubAgentChipRow maps stay untouched.

      Fulfills R7.
    depends_on: ["2a", "2b"]
    complexity: 3
    priority: "must"
    success_criteria:
      - "ai:stopTeammate stops the exact teammate identified by agentId (not a fuzzy name match) and its status update is emitted using the explicitly-passed lead sessionId, not lastUsedSessionId (unit test with lastUsedSessionId unset)"
      - "A user stop is distinguishable from a stall-watchdog abort in the logged outcome (message or marker)"
      - "Stop button renders only for running/blocked teammates and disables while the stop is in flight"
      - "Stopping a teammate that already completed/errored returns a graceful no-op result, not a throw"
    files_affected:
      - "packages/runtime/src/ai/server/providers/TeammateManager.ts"
      - "packages/runtime/src/ai/server/providers/ClaudeCodeProvider.ts"
      - "packages/electron/src/main/services/ai/AIService.ts"
      - "packages/electron/src/preload/index.ts"
      - "packages/electron/src/renderer/electron.d.ts"
      - "packages/electron/src/renderer/components/AgentMode/TeammateThreadPopover.tsx"
    agent_context: |
      Sequenced after 2a (TeammateManager.ts same-file) and 2b (popover
      same-file). Do not build a second abort mechanism -- stop() at
      :1915-1942 is the one true path; this task widens its addressing and
      threads sessionId explicitly (same principle as 1a's fix to
      sendMessageToManagedTeammate).

