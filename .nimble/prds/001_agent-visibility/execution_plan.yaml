# Generated by reviewer synthesis, consumed by PM
waves:
  1: [1b]
  2: [1a, 4a]
  3: [2a, 3a]
  4: [2b, 3b, 4b, 4c]
  5: [2c]
  6: [2d]
  7: [5a]

summary:
  total_waves: 7
  total_tasks: 12
  longest_chain: "1b -> 1a -> 2a -> 2b -> 2c -> 2d -> 5a"
  parallel_capacity: 4

gates:
  - after_wave: 6
    label: "Pre-merge review: CHANGELOG entry + full chip-row/notification diff"
    model: "pause"
    reason: >
      Task 5a (wave 7) touches CHANGELOG.md, which is in .nimble/config.yaml's require_review
      list. No automated review provider is configured for this project, so the gate model
      defaults to pause (human review required) rather than conditional or skip-on-pass.
    precondition: >
      Full feature diff (tasks 1a through 4c) must be available for human review at this gate
      before merge — this is a precondition of the gate itself, not an assertable output of
      task 5a.
