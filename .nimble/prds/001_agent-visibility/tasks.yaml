  - id: "4a"
    title: "Fix concurrent Task sub-agent stall masking"
    description: |
      After the lead's own result arrives, `armPromptEndTimer`'s grace timer
      (ClaudeCodeProvider.ts:1038-1052, SUBAGENT_DRAIN_GRACE_MS = 5 min) resets on ANY
      subsequent chunk regardless of which concurrent Task sub-agent produced it
      (ClaudeCodeProvider.ts:1197-1200, "grace-period-reset-on-activity"). The pre-result
      `shouldArmStreamStallWatchdog` (streamStallWatchdog.ts:56-66) is a different,
      correctly-scoped mechanism for before the lead's result arrives and is NOT the bug here —
      do not touch its arming condition; the solo-sub-agent case is already covered correctly by
      the existing 5-minute post-result grace timer, since nothing else resets it when only one
      sub-agent is running.

      The real gap: when multiple Task sub-agents are draining concurrently post-result, one
      genuinely stalled sub-agent is masked indefinitely by a healthy sibling's activity resetting
      the single shared timer — the grace period never expires as long as *some* sub-agent is
      active. Add per-task-id last-activity tracking (mirroring the `lastActiveAt` pattern already
      used for Teammates, TeammateManager.ts:1524) so a stalled task can be individually detected
      and reaped/flagged even while siblings remain healthy.

      Fulfills requirement R11.
    depends_on: ["1b"]
    complexity: 6
    priority: "must"
    success_criteria:
      - "With two concurrent Task sub-agents, one stalled and one healthy and actively producing chunks, the stalled one is still detected/flagged within a bounded window — not masked indefinitely by the healthy sibling"
      - "A solo sub-agent's existing 5-minute grace-timer reap behavior (already correct today) is unaffected"
      - "The pre-result `shouldArmStreamStallWatchdog` arming condition is NOT modified by this task"
      - "Regression test proves both: concurrent-stall detection now fires, and solo/healthy cases are unregressed"
    files_affected:
      - "packages/runtime/src/ai/server/providers/ClaudeCodeProvider.ts"
    agent_context: |
