tasks:
  - id: "1a"
    title: "Evaluate and pin react-mosaic-component version; add as a dependency"
    description: |
      Research recommends adopting `react-mosaic-component` as the split-pane/tiling engine
      (see research/summary.md). At research time it was mid-migration: v6 is the last stable
      release with a binary-tree layout model; v7 was in beta with an n-ary tree model.

      Before adding the dependency: re-check the current published version and changelog. Pick v6
      (binary, stable) unless v7 has since reached a stable release AND its n-ary model is
      confirmed compatible with this PRD's binary-split-plus-stacking requirement (n-ary is a
      superset of binary, so it should be compatible, but verify the API surface -- particularly
      `MosaicWindow`/tab-group support -- before committing).

      Add the chosen version to `packages/electron/package.json` (this is a `require_review` path
      per `.nimble/config.yaml` -- package.json changes need review). Verify it installs cleanly
      and its peer-dependency React version range covers this repo's React version (this repo is
      on React 19 -- confirm `packages/electron/package.json`'s exact pinned version). Check
      react-mosaic's transitive dependencies (commonly `react-dnd`/`react-dnd-html5-backend` for
      libraries in this space -- verify, do not assume) for React 19 compatibility specifically --
      this is the single most likely cause of this task failing outright, more likely than the
      mosaic package's own peer range.

      Two claims from research were NOT verified against a live source (research explicitly notes
      "no live web search performed") and are load-bearing for later tasks -- verify both before
      finishing this task, not by accident later:
      1. **Tab-group-as-first-class-node claim.** Research's build-vs-adopt recommendation rests on
         react-mosaic modeling "tab groups as a first-class node type." Confirm this against the
         library's actual current docs/API (e.g. `MosaicWindow`'s tab-group support, or whatever
         the current API calls it). Note: this PRD's design does NOT depend on the library
         providing native tab groups -- the per-pane header-bar stack (task 3a's `TileHeaderBar`,
         D1R3) provides stacking independently of react-mosaic's own tab-group feature, hosted
         inside a mosaic leaf. If the claim turns out to be false, the library recommendation
         likely still holds (the split/resize engine is still the valuable, hard-to-hand-build
         part) -- but confirm this deliberately and record the corrected rationale in this task's
         commit message rather than discovering it accidentally during task 5a/6a.
      2. **Drag-and-drop system compatibility -- load-bearing, not just informational.** Confirm
         what DnD mechanism react-mosaic uses internally for its own split/drop zones (commonly
         `react-dnd` for libraries in this space -- verify, do not assume). Neither revision of
         this PRD reuses an existing draggable component here -- the drag-source is built from
         scratch on the new per-tile header bar (`TileHeaderBar`, task 3a; D1R3b -- not on
         `SubAgentChipRow`, which stays a plain opener). This task's job is to determine WHICH
         mechanism 3a should build with: native HTML5 `dataTransfer` (consistent with `TabBar`'s
         existing reordering elsewhere in the app, but not directly reusable here), or `react-dnd`'s
         `useDrag` (if react-mosaic's own drop zones only recognize `react-dnd` drag sources, a
         native HTML5 drag will not register as a valid drop source and 3a/5a would need a bridging
         adapter). Resolve this at this cheap, wave-1 task and record the answer in this task's
         commit message -- it materially determines 3a's implementation approach.

      Tests: none required for a dependency addition alone (no runtime behavior yet). If the
      package ships its own type definitions, verify `npm run typecheck` passes with a trivial
      smoke import.
    depends_on: []
    complexity: 2
    priority: "must"
    success_criteria:
      - "react-mosaic-component is added to packages/electron/package.json at a deliberately chosen, documented version"
      - "npm install succeeds and npm run typecheck is unaffected"
      - "The commit message records which DnD mechanism (native HTML5 vs react-dnd) task 3a must build the header bar's drag-source with"
    files_affected:
      - "packages/electron/package.json"
      - "package-lock.json"

  - id: "3a"
    title: "Build the TileHeaderBar component (per-tile header) with drag-source and close control"
    description: |
      Per PRD decision D1R3 (locked, live user decision, revision 3 -- supersedes revision 2's
      relocated-chip-row switcher, discarded from `feature/native-tile-system`, preserved for
      reference on `archive/011-chip-switcher` at `1b9509bde`): build a new `TileHeaderBar`
      component -- a slim, window-manager-style header bar representing ONE open tile within a
      pane. It is NOT `SubAgentChipRow` relocated or repurposed; `SubAgentChipRow` is untouched by
      this task and keeps its original position/job (D1R3a) as the opener, directly above the
      compose bar in `SessionTranscript.tsx`.

      `TileHeaderBar` renders: a status dot reusing the SAME normalized-status color derivation
      `SubAgentChipRow`'s `STATUS_CLASSES` already uses (`mapTeammateStatus`/`mapTaskStatus` from
      `store/atoms/subAgentStatus.ts`) -- do not invent new color literals or duplicate the
      status-to-color mapping; the teammate/task name; a model badge; a drag handle; a close
      control (X). Naming: call this "header" / "tile header" / "pane header" in code, comments,
      and any UI copy -- never "niri header" or "niri-style" (internal design reference only).

      Two concrete responsibilities in this task:

      1. **Drag-source wiring.** Using task 1a's determined mechanism (`react-dnd`'s `useDrag`,
         `MosaicDragType`, a payload carrying the tile's identity and origin pane/`mosaicId` --
         reuse the bridging pattern task 1a documented and the discarded 3a commit
         (`b1ffa282a` on `archive/011-chip-switcher`) already proved: the chip's drag payload must
         carry a real `mosaicId` from `MosaicContext` for react-mosaic's own drop targets to accept
         it later in tasks 5a/6a). This task adds the drag-source only -- it does not implement
         drop-target/split/stack logic (5a/6a's job).
      2. **Close control.** Per D1R3c, the header's X is the tile's close control going forward.
         Wire it to the same close atom/handler `TeammateTileRail.tsx`/`TaskTileRail.tsx`'s
         existing `handleClose` already uses -- do not duplicate close logic. If those files still
         render their own internal Close button after this task, note it for 4a/10a to remove (do
         not remove it here if it requires touching those files' render trees -- that overlaps 4a's
         scope; if removing it here is a one-line change with no other 4a conflict, do it and note
         it in your summary instead of leaving a stub for 4a).

      Introduce the active-tile Jotai atom **pane-scoped from the start**, not session-scoped: key
      it by `(sessionId, paneId)`, colocated with the other tile-open atoms in `agentMode.ts` (per
      D4 -- does not change `openTeammateTilesAtomFamily`'s own shape, this is new and additive).
      Since task 4a is what introduces the real multi-pane mosaic tree, this task can define the
      atom family and a placeholder single `paneId` (e.g. a constant "root" pane id) for 4a to
      thread through when it builds the real tree -- the point is the atom's KEY SHAPE must already
      be pane-scoped so 5a never needs to migrate it (a real cost the discarded revision-2 3a/5a
      split would have paid).

      Tests: red-first, new `TileHeaderBar.test.tsx`. Assert: the header renders the correct status
      dot color/name/model badge for a teammate and a task tile using the shared status-color
      derivation (not a hardcoded/duplicated mapping); clicking the close control invokes the same
      close handler `TeammateTileRail`/`TaskTileRail` already use; the header exposes the
      drag-source attributes/handlers from the mechanism task 1a determined. Do not assert on CSS
      classNames for drag state.
    depends_on: ["1a"]
    complexity: 5
    priority: "must"
    success_criteria:
      - "A new TileHeaderBar component exists, rendering status dot (shared color derivation), name, model badge, drag handle, and close control for one tile"
      - "SubAgentChipRow is untouched -- still at its original position/role as opener (D1R3a)"
      - "TileHeaderBar exposes drag-source capability using the mechanism determined in task 1a, carrying a real mosaicId payload"
      - "The close control routes through the same close handler TeammateTileRail/TaskTileRail already use, not a new duplicate"
      - "A new, additive activeTileAtomFamily keyed by (sessionId, paneId) exists in agentMode.ts; openTeammateTilesAtomFamily and sibling atoms' own shape is unchanged (D4)"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TileHeaderBar.tsx (new)"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TileHeaderBar.test.tsx (new)"
      - "packages/electron/src/renderer/store/atoms/agentMode.ts"

  - id: "4a"
    title: "Core split-pane integration: single-pane react-mosaic tree with a header-stack switcher"
    description: |
      Replace `TeammateTileRail.tsx`/`TaskTileRail.tsx`'s fixed horizontal-scroll rail layout with
      a `react-mosaic-component` `Mosaic` tree, built as a NEW `TiledRegion.tsx` host component. At
      this stage the tree has exactly ONE leaf/pane (no splitting yet -- that is task 5a), but the
      pane's internal model must already be the real one: an ordered list of tile refs occupying
      that pane, a pane-scoped active-tile index (using 3a's `activeTileAtomFamily(sessionId,
      paneId)`), and a stack of `TileHeaderBar`s (task 3a) at the top of the pane rendering one
      header per occupying tile, with the focused tile's transcript content below (reuse existing
      transcript-rendering, do not rebuild it). A pane with only one tile still renders its single
      header bar (D1R3), not a bare content view.

      `SubAgentChipRow` (unmoved, D1R3a) is what opens a tile into this pane in the first place --
      wire its `onTeammateClick`/`onTaskClick` to open-or-focus into the (currently only) pane
      rather than toggling a standalone rail tile open/closed, matching D1R3a's click semantics:
      opening a not-yet-open tile opens it and focuses it in the active pane; clicking an
      already-open, already-focused tile's chip is a no-op; clicking an open-but-background tile's
      chip switches focus to it within its pane.

      This is the foundational risk task -- get the single-pane case (with a real, if trivial,
      multi-tile header stack) fully correct (mount/unmount behavior, styling against `--nim-*`
      variables, sizing within `SessionTranscript.tsx`'s layout, hide-not-unmount for background
      tiles per the discarded revision-2 4a's `display:none` pattern, cite `f97ec3b39` on
      `archive/011-chip-switcher` for the DndProvider/single-HTML5-backend and mosaic-under-jsdom
      setup learnings) before task 5a adds real recursive splitting on top.

      A gate follows this task (see execution_plan.yaml) -- the human confirms the header-bar
      switcher (D1R3) and the pane model are working as expected before 5a/6a/7a build further on
      this foundation. Note for the gate reviewer: simultaneous multi-pane visibility does not
      exist yet (only one pane exists until 5a) -- a session with multiple open tiles shows them
      all as header bars stacked in the single pane, with only the focused one's content visible.
      This is the expected interim state, not a regression.

      Tests: red-first, `TiledRegion.test.tsx`. Test that opening a teammate tile and a task tile
      via `SubAgentChipRow` both produce a header bar in the pane's stack and are switchable by
      clicking their headers; test that closing all tiles collapses back to the "no tiles open"
      state while `SubAgentChipRow` itself remains visible; test that a single-tile pane still
      renders its one header bar. Do not yet test split/stack across multiple panes (5a/6a).
    depends_on: ["1a", "3a"]
    complexity: 7
    priority: "must"
    success_criteria:
      - "TeammateTileRail/TaskTileRail's fixed-rail layout is replaced by a react-mosaic tree (TiledRegion.tsx) whose single pane renders a TileHeaderBar stack at its top"
      - "SubAgentChipRow (unmoved) opens-or-focuses tiles into the pane; header-bar clicks focus within the pane"
      - "A single-tile pane still shows its one header bar, not a bare content view"
      - "Backgrounded tiles within the pane are hidden (CSS), not unmounted"
      - "No split or stack across multiple panes yet -- that is explicitly out of scope for this task"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TeammateTileRail.tsx"
      - "packages/electron/src/renderer/components/AgentMode/TaskTileRail.tsx"
      - "packages/electron/src/renderer/components/AgentMode/TiledRegion.tsx (new -- mosaic host component)"
      - "packages/electron/src/renderer/components/AgentMode/TiledRegion.css (new)"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TiledRegion.test.tsx (new)"
      - "packages/electron/src/renderer/components/UnifiedAI/SessionTranscript.tsx"

  - id: "5a"
    title: "Drag-to-edge splitting: dragging a header to any pane's edge creates a horizontal or vertical split, to arbitrary depth"
    description: |
      Wire the header's drag-source (`TileHeaderBar`, task 3a, using the mechanism task 1a
      determined) to react-mosaic's split API. When a header is dragged and dropped near the edge
      of a pane, create a new mosaic split node at that edge: dropping on the left/right edge
      creates a vertical split (side-by-side columns); dropping on the top/bottom edge creates a
      horizontal split (stacked rows) -- matching niri's edge-drop convention (D1R3d).

      Per D1R3d, this must be genuine recursive binary splitting, not a single top-level split:
      the target of a drop can be ANY existing pane in the current tree, at ANY depth (a pane that
      is itself already the result of a prior split), and the resulting mosaic tree must nest
      correctly -- splitting a pane that is already a child of another split produces a
      three-(or-more)-level tree, matching niri/i3 manual tiling exactly. Do not special-case or
      assume a maximum of one split level; lean on react-mosaic's own recursive tree/window/split
      APIs (D2/D1R3d) so arbitrary depth falls out of the library's own model rather than custom
      depth-limited logic.

      Determine edge-vs-center (task 6a) intent by drop-zone geometry within the target pane:
      within roughly 28% of that pane's shorter dimension from an edge is an edge-drop; the
      remainder is the center zone for 6a (D1R3d). React-mosaic's own drag-and-drop primitives
      (`MosaicDragType`, `MosaicWindow`'s built-in drop-target support) may already provide this
      distinction -- prefer using them over hand-rolling geometry detection if they cover this
      case; investigate react-mosaic's own DnD API before building a custom one.

      Task 3a's `activeTileAtomFamily` is already pane-scoped (keyed by `(sessionId, paneId)`) --
      this task does not need to migrate its shape, only ensure that once a header's tile is moved
      to a newly-created pane via edge-drop, that new pane's own active-tile entry tracks it,
      independent of the origin pane's.

      Per D1R3d/R9, this task also owns the reverse operation: closing the last tile in a pane
      (via that tile's header close control, D1R3c) must auto-collapse that pane's split so the
      sibling pane takes over the freed space, using react-mosaic's own tree-removal API (do not
      hand-roll tree surgery if react-mosaic covers pane removal natively). This is required
      behavior, not an optional follow-up -- a pane-creation task that does not also handle
      pane-removal leaves the tree in a permanently-growing, never-shrinking state.

      Tests: red-first. Simulate a drop event at each edge (top/bottom/left/right) of an existing
      pane and assert the resulting mosaic tree shape (a new split node of the correct orientation
      containing both the original and moved tile). Additionally simulate a second split on one of
      the two resulting panes and assert the tree now nests three levels deep with correct
      orientations at each level -- this is the test that actually proves "arbitrary depth," a
      single top-level split test does not. Also simulate closing the last tile in a split-created
      pane and assert the mosaic tree collapses back to the sibling pane occupying the freed space
      (an actual tree-shape assertion, not just a visual claim).
    depends_on: ["4a"]
    complexity: 7
    priority: "must"
    success_criteria:
      - "Dragging a header to a pane's left/right edge creates a vertical (side-by-side) split"
      - "Dragging a header to a pane's top/bottom edge creates a horizontal (stacked) split"
      - "Splitting a pane that is already the child of a prior split produces a correctly-nested multi-level tree -- verified by a test that performs two successive splits, not just one"
      - "The moved tile is removed from its origin pane's header stack and appears as the active tile in the new pane"
      - "Active-tile state (already pane-scoped from 3a) correctly tracks the new pane once it is created"
      - "Closing the last tile in a split-created pane collapses that split and the sibling pane takes over the freed space (R9), verified by a tree-shape test"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TiledRegion.tsx"
      - "packages/electron/src/renderer/components/AgentMode/TileHeaderBar.tsx"
      - "packages/electron/src/renderer/store/atoms/agentMode.ts"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TiledRegion.test.tsx"

  - id: "6a"
    title: "Tab-stacking: dragging a header to a pane's center adds it to that pane's header stack"
    description: |
      Complete the drop-intent handling started in 5a: a drop in the CENTER zone of a target pane
      (not an edge, per D1R3d's ~28%-of-shorter-dimension edge threshold) adds the dragged tile to
      that pane's header stack (both tiles are now reachable via headers within the same pane)
      instead of creating a new split.

      Sequenced after 5a (not a hard functional dependency, but both tasks touch the same
      `TiledRegion.tsx` drop-handling logic -- sequenced for file-conflict safety in the shared,
      worktree-free checkout per D7). Center-drop stacking applies to any pane in the tree, at any
      depth, same as 5a's edge-drop splitting -- there is nothing depth-limited about which panes
      are valid stack targets.

      Tests: red-first. Simulate a center-zone drop and assert the target pane's header stack now
      contains both tiles, with no new mosaic split node created, and the dragged tile becomes the
      active tile in its new pane.
    depends_on: ["5a"]
    complexity: 5
    priority: "must"
    success_criteria:
      - "Dragging a header to a pane's center zone adds it to that pane's header stack, not a new split"
      - "The stacked tile becomes the active tile in its destination pane"
      - "Edge-drop splitting (5a) is unaffected by this change"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TiledRegion.tsx"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TiledRegion.test.tsx"

  - id: "7a"
    title: "Replace each tile's bespoke compose box with the shared AIInput/SessionAIInput"
    description: |
      `TeammateTileRail.tsx`/`TaskTileRail.tsx` each carry their own duplicated compose input,
      explicitly flagged in existing code comments as "deliberately duplicated" against
      `TeammateThreadPopover.tsx` and requiring lockstep maintenance. Remove both bespoke compose
      boxes and instantiate the existing `AIInput`/`SessionAIInput`
      (`packages/electron/src/renderer/components/UnifiedAI/`) instead, parameterized by whichever
      tile is currently active within `TiledRegion` (per D3: one shared instance per visible
      focused pane, not one per open tile -- backgrounded/stacked tiles do not get a live compose
      instance).

      `teammateComposeMode()`'s existing revive/inactive branching
      (`TeammateTileRail.tsx:75-86`-equivalent -- confirm current line numbers, they may have
      shifted since research) has no equivalent in `AIInput` and must be preserved as a thin
      wrapper: render the revive/inactive affordance instead of `AIInput` when
      `teammateComposeMode()` says so; render the shared `AIInput` otherwise.

      Do NOT modify `TeammateThreadPopover.tsx`'s own compose box in this task -- it currently has
      no render callsite anywhere in the app (pre-existing dead code, unrelated to this PRD; see
      Research Findings). Do not touch it; note the observation in the commit message only.

      Tests: red-first. Extend `TeammateTileRail.test.tsx`/`TaskTileRail.test.tsx` (or their
      `TiledRegion`-integrated successors from 4a) to assert: a focused, active/compose-eligible
      tile renders the shared `AIInput` parameterized with the correct `sessionId`; a
      revive/inactive-eligible teammate tile still renders the existing revive/inactive affordance,
      not `AIInput`. Mock the narrowest module (`AIInput` itself or its deep dependencies), not the
      `@nimbalyst/runtime` barrel.
    depends_on: ["4a"]
    complexity: 6
    priority: "must"
    success_criteria:
      - "No bespoke duplicated compose box remains in TeammateTileRail.tsx or TaskTileRail.tsx"
      - "The active tile's compose UI is the shared AIInput/SessionAIInput, parameterized by that tile's sessionId"
      - "teammateComposeMode's revive/inactive branching is preserved as a wrapper around, not inside, the shared input"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TeammateTileRail.tsx"
      - "packages/electron/src/renderer/components/AgentMode/TaskTileRail.tsx"
      - "packages/electron/src/renderer/components/UnifiedAI/AIInput.tsx (read/instantiate only -- do not modify unless a genuine prop gap is found; if so, note the gap in the commit message)"
      - "packages/electron/src/renderer/store/atoms/agentMode.ts (read only -- reads the pane-scoped activeTileAtomFamily introduced in 3a to determine which tile's compose box to render)"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TeammateTileRail.test.tsx"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TaskTileRail.test.tsx"

  - id: "8a"
    title: "Remount safety: hide, don't unmount, a backgrounded tile within a pane's stack"
    description: |
      Per the editor-state rule's spirit and research's remount-constraint finding: when a pane's
      stack has multiple tiles (post-6a) and the user switches the active tile within that stack
      (by clicking a header in the pane's header stack, D1R3), the previously-active tile's content must be hidden (CSS
      `display:none` or equivalent), not unmounted -- avoiding a refetch-on-remount cost against
      `aiGetTeammateTranscript`. `RichTranscriptView` already keeps a per-session VList cache that
      survives remounts (more forgiving than Monaco/Lexical/RevoGrid), but hide-not-unmount is
      still the correct, cheaper behavior and must be verified explicitly, not assumed from the
      cache's existence.

      Audit `TiledRegion`'s pane-content rendering (from 4a/6a) for whether switching the active
      tile within a stack currently remounts the inactive tile's content tree; if so, change it to
      a CSS-hide pattern (render all stacked tiles' content, toggle visibility, rather than
      conditionally rendering only the active one).

      Tests: red-first. Render a pane with two stacked tiles; switch the active tile by clicking
      the other tile's header; assert the previously-active tile's content component is still mounted (e.g. via a
      mount-count spy or an effect that would re-fire `aiGetTeammateTranscript` on remount) rather
      than unmounted and remounted.
    depends_on: ["6a", "7a"]
    complexity: 3
    priority: "should"
    success_criteria:
      - "Switching the active tile within a stacked pane hides, rather than unmounts, the previously-active tile's content"
      - "No duplicate aiGetTeammateTranscript fetch occurs when returning to a previously-viewed tile via its header"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TiledRegion.tsx"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TiledRegion.test.tsx"

  - id: "9a"
    title: "Resizable split dividers, styled to app theme; session-lifetime layout state"
    description: |
      Verify/theme react-mosaic's default resizable-divider behavior to use this repo's canonical
      `--nim-*` CSS variables (per UI_PATTERNS.md) rather than the library's default styling.

      Per PRD decision D6 (locked): the mosaic layout tree (split/stack arrangement, including
      which tile is active in each pane) persists only for the session's lifetime, held in a Jotai
      atom colocated with the other tile-open atoms in `agentMode.ts`. Do NOT persist it to
      `workspace-settings`/IPC/disk in this task -- that is explicitly deferred as a should-have
      (R8). Do NOT use `localStorage` under any circumstances (repo rule).

      Tests: red-first. Assert dragging a divider updates the mosaic tree's split percentage in the
      session-lifetime atom; assert the atom's value does not survive a simulated app
      reload/remount (confirming it is genuinely session-lifetime-only, not accidentally persisted).
    depends_on: ["5a"]
    complexity: 4
    priority: "must"
    success_criteria:
      - "Split dividers are draggable/resizable and styled with --nim-* variables, not library-default styling"
      - "Layout state (split tree, sizes, per-pane active tile) lives in a session-lifetime Jotai atom, not localStorage or workspace-settings"
    files_affected:
      - "packages/electron/src/renderer/components/AgentMode/TiledRegion.tsx"
      - "packages/electron/src/renderer/store/atoms/agentMode.ts"
      - "packages/electron/src/renderer/components/AgentMode/__tests__/TiledRegion.test.tsx"

  - id: "10a"
    title: "Final integration: migrate SessionTranscript.tsx to the new tiled region, remove the old rail path"
    description: |
      `SessionTranscript.tsx` currently composes `TeammateTileRail`/`TaskTileRail` alongside the
      main thread pane using the old fixed-rail layout, with `SubAgentChipRow` rendered separately
      near the compose bar as the opener. Migrate the rail composition to render the new
      `TiledRegion` (from 4a, extended through 5a/6a/7a/8a/9a, with each pane's `TileHeaderBar`
      stack) instead. Remove the old fixed-rail rendering path only. Per D1R3a, `SubAgentChipRow`
      is NOT removed and its call site does NOT move -- it stays exactly where it already is,
      directly above the compose bar, still the mechanism that opens a tile into `TiledRegion` in
      the first place. Do not leave the old fixed-rail path co-existing behind a flag (no evidence
      this needs to be gradual/flagged; this repo's convention per prior PRDs is a clean cutover) --
      that clean-cutover rule applies to the rail layout, not to `SubAgentChipRow`.

      Verify no other consumer references the old rail components' now-removed rendering path
      (grep for `TeammateTileRail`/`TaskTileRail` imports across the renderer) before deleting dead
      code. While sweeping, confirm `TeammateThreadPopover.tsx` remains genuinely unreferenced
      (flagged in Research Findings as pre-existing dead code) -- note it in the commit message if
      still true, but do not delete it in this PRD (out of scope; it predates this work).

      Dependency note: this task's hard dependencies are 6a, 7a, and 9a (all must-have). It is
      sequenced in the wave plan after 8a (should-have) as well, but does not functionally require
      it -- if 8a is descoped at review, this task proceeds unaffected.

      Tests: red-first, and this is the integration-level test point -- extend or add a
      `SessionTranscript` test asserting the tiled region (with `SubAgentChipRow` still rendered
