note: "Worktree-free-local cadence (no PRs, no git worktrees, no gh), per D7: all tasks edit the main checkout on feature/native-tile-system sequentially, one at a time, coordinator commits per task. Every wave is single-task -- sequenced for both genuine dependencies and file-conflict safety in the shared checkout, matching PRD 006-010 precedent for this repo."
