sources:
  - title: "Work with sessions — Claude Agent SDK"
    url: "https://code.claude.com/docs/en/agent-sdk/sessions"
    accessed: "2026-08-28"
    relevance: high
    notes: >
      Primary source for the narrow external question: confirms `resume` with a session id works
      identically for a completed session as for an in-progress one ("Follow up on a completed
      task" is the first listed resume use case). Also documents same-machine requirement, cwd-scoped
      session file lookup, and cross-host resume via SessionStore adapter or manual file transfer —
      none of which Nimbalyst currently implements for teammates.
    original_url_before_redirect: "https://platform.claude.com/docs/en/agent-sdk/sessions"
