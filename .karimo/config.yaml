# KARIMO Configuration
# Generated by /karimo:configure

config_version: "2.0"

# Execution Mode: full | fast-track
mode: fast-track

project:
  name: "nimbalyst"
  runtime: "node"
  runtime_version: ">=24"
  framework: "monorepo (electron, runtime, ios, android, marketplace)"
  package_manager: "npm"

commands:
  build: "npm run build"
  test: "npm run test:prepush"
  lint: "npm run lint --workspace=@nimbalyst/electron"
  typecheck: "npm run typecheck"

boundaries:
  never_touch:
    - "node_modules/**"
    - "packages/*/node_modules/**"
    - "package-lock.json"
    - "packages/browser-extension/package-lock.json"
    - ".nimbalyst/**"
    - "nimbalyst-local/**"
    - "dist/**"
    - "out/**"
    - "out2/**"
    - "release/**"
    - "packages/electron/release/**"
    - "packages/electron/index.js"
    - ".env"
    - ".env.local"
    - ".env.*.local"
    - "*.jks"
    - "*.keystore"
    - ".mcp.json"

  require_review:
    - "packages/electron/src/main/**"
    - "packages/runtime/src/auth/jwtScopes.ts"
    - "packages/electron/src/database/**"
    - "packages/electron/src/database/migrations/*.sql"
    - ".github/workflows/**"
    - "scripts/install-git-hooks.mjs"
    - "scripts/run-workspace-script.mjs"
    - "CHANGELOG.md"

execution:
  default_model: "sonnet"
  max_parallel_tasks: 3
  pre_pr_checks:
    - "build"
    - "typecheck"
    - "test"

review:
  enabled: false
  provider: null                    # greptile | code-review | none
  threshold: 5
  max_revision_loops: 3
  none_behavior: manual             # manual | auto-pass
  allow_below_threshold_on:
    - future-work-overlap
    - false-positive-factual
  final_merge_gate:
    enabled: true
    verify_deferred_findings: true
  pre_execution_prompt: true

cost_controls:
  enable_escalation: true
  max_attempts: 3
  retry_delay_seconds: 10

subscription:
  plan: max-5x
  team_seats: 1
  enterprise_capacity: 0
  configured_at: "2026-08-20T01:40:10Z"
